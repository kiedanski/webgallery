AutoName: WebGallery
Description: |-
  WebGallery is a minimal Android gallery app that displays photos and videos
  served from a Tilde personal cloud server via WebDAV. The app downloads
  256px thumbnails for offline grid browsing, caches opened full-resolution
  images with a configurable LRU cache, and supports marking photos and videos
  as favorites for permanent offline access.

  Features:

  * Offline-first thumbnail browsing
  * Full-resolution photo viewer with pinch-to-zoom and swipe navigation
  * Video streaming with auto-play (Media3/ExoPlayer)
  * Mark photos and videos as favorites for permanent offline access
  * Configurable LRU cache (200&nbsp;MB to Unlimited)
  * Material 3 UI with dark mode and dynamic colors
  * HTTP Basic Auth credentials encrypted with AES-256-GCM
  * Zero proprietary dependencies, no analytics

